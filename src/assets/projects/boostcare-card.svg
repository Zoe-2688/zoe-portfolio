<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-label="BoostCare">
  <defs>
    <linearGradient id="bcbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F6E56"/>
      <stop offset="1" stop-color="#04342C"/>
    </linearGradient>
    <radialGradient id="bcglow" cx="0.5" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#35B58C" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#35B58C" stop-opacity="0"/>
    </radialGradient>
    <filter id="bcshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bcbg)"/>
  <ellipse cx="400" cy="70" rx="440" ry="240" fill="url(#bcglow)"/>

  <!-- wordmark centrado -->
  <text x="400" y="86" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="46" font-weight="800">
    <tspan fill="#E8A090">Boost</tspan><tspan fill="#ffffff">Care</tspan>
  </text>
  <text x="400" y="114" text-anchor="middle" font-family="monospace" font-size="15" fill="#9FE1CB" letter-spacing="1">SaaS de salud · Figma → React → deploy</text>

  <!-- badge en vivo centrado -->
  <g transform="translate(336,134)">
    <rect width="128" height="30" rx="15" fill="#04342C" fill-opacity="0.55" stroke="#5DCAA5" stroke-opacity="0.5"/>
    <circle cx="20" cy="15" r="5" fill="#5DCAA5"/>
    <text x="34" y="20" font-family="monospace" font-size="13" fill="#C8EDE0">En vivo · 98/100</text>
  </g>

  <!-- tarjeta dashboard centrada (mimetiza la app real) -->
  <g filter="url(#bcshadow)" transform="translate(220,190)">
    <rect width="360" height="250" rx="20" fill="#FFFFFF"/>
    <text x="24" y="48" font-family="Inter, sans-serif" font-size="21" font-weight="800" fill="#0F1712">Hola, Dra. Ramírez</text>
    <text x="24" y="70" font-family="Inter, sans-serif" font-size="12" fill="#55685E">Lunes 13 de julio · 3 pacientes en alerta</text>

    <rect x="24" y="86" width="312" height="60" rx="14" fill="#E1F5EE"/>
    <text x="38" y="109" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0F6E56">✨ Resumen del día</text>
    <text x="38" y="129" font-family="Inter, sans-serif" font-size="11" fill="#0F1712">Cármen Mercédes es tu prioridad: 40% de adherencia.</text>

    <g transform="translate(24,160)">
      <rect width="312" height="62" rx="12" fill="#F7FAF8" stroke="#DCE5E0"/>
      <circle cx="34" cy="31" r="17" fill="#E1F5EE"/>
      <text x="34" y="35" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0F6E56" text-anchor="middle">CM</text>
      <text x="62" y="27" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0F1712">Cármen Mercédes</text>
      <text x="62" y="43" font-family="Inter, sans-serif" font-size="10" fill="#55685E">62 años · Demencia frontotemporal</text>
      <rect x="244" y="19" width="54" height="24" rx="7" fill="#FEE2E2"/>
      <text x="271" y="35" font-family="monospace" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">✕ 40%</text>
    </g>
  </g>
</svg>
