<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="BoostCare">
  <defs>
    <linearGradient id="bcbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F6E56"/>
      <stop offset="1" stop-color="#04342C"/>
    </linearGradient>
    <linearGradient id="bcglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35B58C" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#35B58C" stop-opacity="0"/>
    </linearGradient>
    <filter id="bcshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="url(#bcbg)"/>
  <ellipse cx="620" cy="60" rx="380" ry="220" fill="url(#bcglow)"/>

  <!-- circuit hint -->
  <g stroke="#9FE1CB" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <path d="M40 470 H160 V400 H240"/>
    <path d="M40 120 H120 V180"/>
    <circle cx="240" cy="400" r="3" fill="#9FE1CB" fill-opacity="0.4" stroke="none"/>
    <circle cx="120" cy="180" r="3" fill="#9FE1CB" fill-opacity="0.4" stroke="none"/>
  </g>

  <!-- wordmark -->
  <text x="56" y="90" font-family="Inter, Segoe UI, sans-serif" font-size="46" font-weight="800">
    <tspan fill="#E8A090">Boost</tspan><tspan fill="#ffffff">Care</tspan>
  </text>
  <text x="58" y="122" font-family="monospace" font-size="17" fill="#9FE1CB" letter-spacing="1">SaaS de salud · Figma → React → deploy</text>

  <!-- live badge -->
  <g transform="translate(58,150)">
    <rect width="128" height="30" rx="15" fill="#04342C" fill-opacity="0.55" stroke="#5DCAA5" stroke-opacity="0.5"/>
    <circle cx="20" cy="15" r="5" fill="#5DCAA5"/>
    <text x="34" y="20" font-family="monospace" font-size="13" fill="#C8EDE0">En vivo · 98/100</text>
  </g>

  <!-- app panel (mimics dashboard) -->
  <g filter="url(#bcshadow)" transform="translate(430,120)">
    <rect width="320" height="360" rx="22" fill="#FFFFFF"/>
    <text x="24" y="52" font-family="Inter, sans-serif" font-size="21" font-weight="800" fill="#0F1712">Hola, Dra. Ramírez</text>
    <text x="24" y="74" font-family="Inter, sans-serif" font-size="12" fill="#55685E">Lunes 13 de julio · 3 pacientes en alerta</text>

    <rect x="24" y="90" width="272" height="66" rx="14" fill="#E1F5EE"/>
    <text x="38" y="114" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0F6E56">✨ Resumen del día</text>
    <text x="38" y="134" font-family="Inter, sans-serif" font-size="11" fill="#0F1712">Cármen Mercédes es tu prioridad:</text>
    <text x="38" y="149" font-family="Inter, sans-serif" font-size="11" fill="#0F1712">40% de adherencia. Revísala primero.</text>

    <g transform="translate(24,172)">
      <rect width="272" height="52" rx="12" fill="#F7FAF8" stroke="#DCE5E0"/>
      <rect x="12" y="14" width="42" height="24" rx="7" fill="#E1F5EE"/>
      <text x="33" y="30" font-family="monospace" font-size="11" font-weight="700" fill="#0F6E56" text-anchor="middle">09:00</text>
      <text x="66" y="24" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0F1712">Carlos Mendoza</text>
      <text x="66" y="40" font-family="Inter, sans-serif" font-size="10" fill="#55685E">Control cognitivo · Presencial</text>
    </g>

    <g transform="translate(24,234)">
      <rect width="272" height="60" rx="12" fill="#F7FAF8" stroke="#DCE5E0"/>
      <circle cx="30" cy="30" r="16" fill="#E1F5EE"/>
      <text x="30" y="34" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0F6E56" text-anchor="middle">CM</text>
      <text x="56" y="26" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0F1712">Cármen Mercédes</text>
      <text x="56" y="42" font-family="Inter, sans-serif" font-size="10" fill="#55685E">62 años · Demencia frontotemporal</text>
      <rect x="206" y="18" width="54" height="24" rx="7" fill="#FEE2E2"/>
      <text x="233" y="34" font-family="monospace" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">✕ 40%</text>
    </g>

    <rect x="24" y="308" width="272" height="34" rx="12" fill="#0F6E56"/>
    <text x="160" y="330" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Nueva receta digital</text>
  </g>
</svg>
